<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Opuscolo – Due Passi in Paradiso</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>

html, body {
  margin: 0;
  padding: 0;
  background: #020617;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #e5e7eb;
}

.wrapper {
  max-width: 980px;
  margin: 0 auto;
  padding: 16px 12px 24px;
  box-sizing: border-box;
}

/* SWIPER */

.swiper {
  width: 100%;
}

.swiper-slide {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* PAGINE */

.page-single {
  width: 100%;
}

/* ZOOM */

.zoom-container {
  overflow: hidden;
  touch-action: none;
}

.zoom-container img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
}

/* NAV */

.swiper-button-next,
.swiper-button-prev {
  color: #ffffff;
}

.swiper-pagination-bullet {
  background: #cbd5e1;
  opacity: 0.7;
}

.swiper-pagination-bullet-active {
  background: #ffffff;
  opacity: 1;
}

/* FOOTER */

.footer {
  text-align: center;
  margin-top: 18px;
}

.home-btn {
  display: inline-block;
  padding: 12px 20px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.75);
  color: #e5e7eb;
  text-decoration: none;
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
}

</style>
</head>

<body>

<div class="wrapper">

<div class="swiper">
<div class="swiper-wrapper">

<!-- COVER -->
<div class="swiper-slide">
  <div class="page-single zoom-container">
    <img src="files/opuscolo/cover_front.jpg">
  </div>
</div>

<!-- PAGINE -->
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_02.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_03.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_04.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_05.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_06.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_07.jpg"></div></div>

<!-- MAPPA CENTRALE -->
<div class="swiper-slide">
  <div class="page-single zoom-container">
    <img src="files/opuscolo/spread_08.jpg">
  </div>
</div>

<!-- ALTRE -->
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_09.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_10.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_11.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_12.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_13.jpg"></div></div>
<div class="swiper-slide"><div class="page-single zoom-container"><img src="files/opuscolo/page_14.jpg"></div></div>

<!-- BACK -->
<div class="swiper-slide">
  <div class="page-single zoom-container">
    <img src="files/opuscolo/cover_back.jpg">
  </div>
</div>

</div>

<div class="swiper-pagination"></div>
<div class="swiper-button-prev"></div>
<div class="swiper-button-next"></div>

</div>

<div class="footer">
  <a class="home-btn" href="index.html">← Torna alla home</a>
</div>

</div>

<!-- LIBRERIE -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom/dist/panzoom.min.js"></script>

<script>

// SWIPER
const swiper = new Swiper('.swiper', {
  loop: false,
  spaceBetween: 16,
  autoHeight: true,
  pagination: {
    el: '.swiper-pagination',
    clickable: true
  },
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev'
  }
});

// ZOOM
const containers = document.querySelectorAll('.zoom-container');

containers.forEach(container => {
  const img = container.querySelector('img');

  const panzoom = Panzoom(img, {
    maxScale: 4,
    minScale: 1,
    contain: 'outside'
  });

  container.addEventListener('wheel', panzoom.zoomWithWheel);

  container.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) {
      e.stopPropagation(); // evita conflitto con swipe
    }
  });
});

</script>

</body>
</html>
