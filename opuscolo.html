<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Opuscolo – Due Passi in Paradiso</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<!-- PRECARICAMENTO IMMAGINI PIÙ IMPORTANTI -->
<link rel="preload" as="image" href="files/opuscolo/cover_front.jpg">
<link rel="preload" as="image" href="files/opuscolo/page_02.jpg">
<link rel="preload" as="image" href="files/opuscolo/page_03.jpg">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #020617;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #e5e7eb;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  overflow-y: auto;
}

.wrapper {
  max-width: 980px;
  margin: 0 auto;
  padding: 16px 12px 28px;
  box-sizing: border-box;
}

.swiper {
  width: 100%;
  overflow: hidden;
}

.swiper-slide {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.page-single {
  width: 100%;
}

.swiper-zoom-container {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  width: 100%;
}

.swiper-zoom-container img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  user-select: none;
  -webkit-user-drag: none;
}

/* NAV */
.swiper-button-next,
.swiper-button-prev {
  color: #ffffff;
}

.swiper-button-next::after,
.swiper-button-prev::after {
  font-size: 28px;
  font-weight: 700;
}

.swiper-pagination {
  position: static;
  margin-top: 14px;
  margin-bottom: 18px;
  text-align: center;
}

.swiper-pagination-bullet {
  background: #cbd5e1;
  opacity: 0.7;
}

.swiper-pagination-bullet-active {
  background: #ffffff;
  opacity: 1;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 4px;
}

.home-btn {
  display: inline-block;
  padding: 12px 20px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.75);
  color: #e5e7eb;
  text-decoration: none;
  box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
}

@media (max-width: 768px) {
  .swiper-button-next,
  .swiper-button-prev {
    display: none;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="swiper">
    <div class="swiper-wrapper">

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/cover_front.jpg" alt="Copertina opuscolo" loading="eager" fetchpriority="high">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_02.jpg" alt="Pagina 2" loading="eager">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_03.jpg" alt="Pagina 3" loading="eager">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_04.jpg" alt="Pagina 4" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_05.jpg" alt="Pagina 5" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_06.jpg" alt="Pagina 6" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_07.jpg" alt="Pagina 7" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_09.jpg" alt="Pagina 9" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_10.jpg" alt="Pagina 10" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_11.jpg" alt="Pagina 11" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_12.jpg" alt="Pagina 12" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_13.jpg" alt="Pagina 13" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/page_14.jpg" alt="Pagina 14" loading="lazy">
          </div>
        </div>
      </div>

      <div class="swiper-slide">
        <div class="page-single">
          <div class="swiper-zoom-container">
            <img src="files/opuscolo/cover_back.jpg" alt="Retro copertina" loading="lazy">
          </div>
        </div>
      </div>

    </div>

    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-pagination"></div>
  </div>

  <div class="footer">
    <a class="home-btn" href="index.html">← Torna alla home</a>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
new Swiper('.swiper', {
  loop: false,
  spaceBetween: 16,
  autoHeight: true,
  preloadImages: false,
  lazy: false,
  zoom: {
    maxRatio: 4,
    minRatio: 1,
    toggle: false
  },
  pagination: {
    el: '.swiper-pagination',
    clickable: true
  },
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev'
  }
});
</script>

</body>
</html>
